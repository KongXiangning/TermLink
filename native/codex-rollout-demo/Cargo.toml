[package]
name = "codex-rollout-demo"
version = "0.1.0"
edition = "2024"
description = "TermLink independent Rust demo: native rollout reading, structured history projection, and parser Spike comparison."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
sha2 = "0.10"
anyhow = "1"
zstd = "0.13"

[profile.release]
opt-level = 2
