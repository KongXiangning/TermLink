schema_version: 1
project:
  type: application
  summary: Mobile-first AI terminal workspace with Android native shell, WebView
    Codex runtime, session APIs, and workspace browsing.
  name: termlink
  slug: termlink
  primary_hosts:
    - claude
    - codex
runtime:
  languages:
    - JavaScript
    - Kotlin
    - HTML
    - CSS
  package_manager: npm
  module_system: commonjs
  build_commands:
    - npm run android:sync
    - npm run android:open
  test_commands:
    - node --test
    - android\gradlew.bat :app:testDebugUnitTest
    - npm run android:check-release-config
  dev_commands:
    - npm run dev
    - npm run start
paths:
  workflow_home: docs/workflow
  source_directories:
    - src
    - android
    - public
    - tests
    - scripts
  documentation_files:
    - README.md
    - ARCHITECTURE.md
    - DATABASE.md
    - docs/README.md
    - docs/adoption/API_INVENTORY.md
    - docs/adoption/RISK_REGISTER.md
    - docs/product/PRODUCT_REQUIREMENTS.md
    - docs/architecture/CURRENT_STATE.md
    - docs/architecture/ROADMAP.md
  workflow_template_directories: []
  existing_skill_template_patterns: []
  generated_artifacts: []
boundaries:
  forbidden_paths:
    - .git/**
    - node_modules/**
  generated_only_paths: []
  workflow_owned_paths:
    - AGENTS.md
    - CLAUDE.md
    - .workflow-system/**
    - docs/workflow/**
    - .agents/skills/bootstrap-project/**
    - .agents/skills/prepare-task/**
    - .agents/skills/review-draft/**
    - .agents/skills/review-change/**
    - .agents/skills/execute-step/**
    - .agents/skills/debug-task/**
    - .agents/skills/task-lifecycle/**
    - .agents/skills/capture-work-item/**
    - .agents/skills/close-task/**
    - .agents/skills/validate-change/**
    - .agents/skills/git-commit/**
architecture_rules:
  - Do not hand-edit generated outputs.
decision_types:
  - mechanical
  - taste
  - user_challenge
governance:
  current_documents:
    - .workflow-system/PROJECT_PROFILE.yaml
    - .workflow-system/WORKFLOW_PROTOCOL.md
    - .workflow-system/FILE_SCHEMAS.md
    - AGENTS.md
    - CLAUDE.md
    - docs/workflow/DOCUMENT_CATALOG.md
    - docs/workflow/BASELINES.md
    - docs/workflow/CONTRACTS.md
    - docs/workflow/CURRENT_TASK.md
    - docs/workflow/DECISIONS.md
    - docs/workflow/LESSONS.md
    - docs/workflow/ROADMAP.md
    - docs/workflow/STATUS.md
    - docs/workflow/TASK_ARCHIVE.md
    - docs/workflow/TASK_SUMMARY.md
    - docs/workflow/WORKFLOW_GUIDE.md
  planned_documents: []
validation:
  matrix:
    - name: unit
      layer: project
      command: node --test
      blocker_level: blocks-merge
      description: Run the repository Node test suite.
      phase: A4
      owner: target-project
    - name: android-unit
      layer: project
      command: android\gradlew.bat :app:testDebugUnitTest
      blocker_level: blocks-merge
      description: Run Android JVM unit tests. Requires Java 21 and the Android toolchain.
      phase: A4
      owner: target-project
    - name: android-release-config
      layer: project
      command: npm run android:check-release-config
      blocker_level: blocks-merge
      description: Validate Android release config invariants for cleartext and scheme
        settings.
      phase: A4
      owner: target-project
    - name: integration
      layer: project
      command: ""
      blocker_level: blocks-merge
      description: No repository-wide integration command is confirmed yet.
      phase: A4
      owner: target-project
    - name: e2e-smoke
      layer: project
      command: ""
      blocker_level: blocks-merge
      description: No repository-wide e2e smoke command is confirmed yet.
      phase: A4
      owner: target-project
    - name: contract-compatibility
      layer: project
      command: ""
      blocker_level: blocks-merge
      description: Contract compatibility checks are not yet bound to a dedicated
        repository-wide command.
      phase: A4
      owner: target-project
    - name: vnext-contract
      layer: protocol
      command: node .workflow-system/runtime/dist/cli.js validate-contract --root .
      blocker_level: blocks-merge
      description: Installed vNext contract
      phase: P9
      owner: workflow-system
    - name: vnext-current-task
      layer: protocol
      command: node .workflow-system/runtime/dist/cli.js validate --root . --summary
      blocker_level: blocks-merge
      description: Canonical current task
      phase: P9
      owner: workflow-system
kind: vnext-project-profile
vnext:
  bootstrap_mode: adopt
  target_identity: 422aec7bf194cc99ac59c0d71a605b4c
  source_contract: .workflow-system/vnext/SOURCE_CONTRACT.yaml
  runtime_contract: .workflow-system/vnext/RUNTIME_CONTRACT.yaml
  runtime_entrypoint: .workflow-system/runtime/dist/cli.js
  legacy_compatibility: absent
